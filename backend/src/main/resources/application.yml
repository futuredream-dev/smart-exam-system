spring:
  application:
    name: smart-exam-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:smart_exam}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    hikari:
      connection-timeout: 5000
      maximum-pool-size: 10
      minimum-idle: 2
      # 开发阶段允许应用先启动；首次实际访问数据库时仍会报告连接错误。
      initialization-fail-timeout: -1
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
  web:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /
    encoding:
      charset: UTF-8
      enabled: true
      force: true

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

jwt:
  # 仅供本机开发；生产环境必须通过 JWT_SECRET 覆盖。
  secret: ${JWT_SECRET:***REMOVED_JWT_SECRET***}
  expiration: ${JWT_EXPIRATION:7200000}
