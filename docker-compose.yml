name: smart-exam
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请配置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-smart_exam}
      MYSQL_USER: ${DB_USERNAME:-smart_exam}
      MYSQL_PASSWORD: ${DB_PASSWORD:?请配置 DB_PASSWORD}
      TZ: Asia/Shanghai
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      # TCP + 应用账号 + 九张表，避免临时初始化服务器提前被判为健康。
      test: [CMD-SHELL, 'MYSQL_PWD="$${MYSQL_PASSWORD}" mysql -h 127.0.0.1 -u "$${MYSQL_USER}" -D "$${MYSQL_DATABASE}" -Nse "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema=DATABASE() AND table_name IN (''users'',''courses'',''course_students'',''exams'',''questions'',''scoring_points'',''submissions'',''answers'',''ai_grading_results'')" | grep -qx 9']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: '3306'
      DB_NAME: ${DB_NAME:-smart_exam}
      DB_USERNAME: ${DB_USERNAME:-smart_exam}
      DB_PASSWORD: ${DB_PASSWORD:?请配置 DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?请配置 JWT_SECRET}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-}
      SERVER_PORT: '8080'
      TZ: Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, --fail, --silent, --max-time, '4', 'http://localhost:8080/actuator/health']
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - '${HTTP_PORT:-80}:80'
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, --spider, 'http://127.0.0.1/healthz']
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  mysql_data:
